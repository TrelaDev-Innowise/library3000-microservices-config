spring:
  config:
    activate:
      on-profile: k8s

consul:
  discovery:
    instance-id: auth-service-${HOSTNAME}  # Unikalne ID na podstawie nazwy Pod-a
    health-check-path: /actuator/health
    health-check-interval: 10s
    health-check-timeout: 1s
    health-check-headers:
      Content-Type: application/json
    scheme: http  # Wymuś HTTP (nie HTTPS)
    hostname: localhost  # KLUCZOWE - wymuś healthchecki na localhost